<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>
<body>
    <!-- Блок вывода ошибки -->
    {% if error %}
        <div>{{ error }}</div>
    {% endif %}

    <form action="{{ url_for('login') }}" method="POST">
        <label>Имя пользователя</label>
        <input type="text" name="username" required>

        <label>Пароль</label>
        <input type="password" name="password" required>

        <button type="submit">Войти</button>
    </form>
</body>
</html>
